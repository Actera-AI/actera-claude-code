name: release
"on":
  push:
    tags:
      - v*
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag whose exact commit passed full CI on main
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  plan:
    if:
      ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name
      == github.repository && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - id: plan
        name: Reuse successful CI for the exact tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-plan.mjs
        timeout-minutes: 5
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ matrix.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Require clean publication history
        run: node scripts/check-publication.mjs --history
        timeout-minutes: 5
      - name: Verify plugin version
        run:
          node -e "if ('v'+JSON.parse(require('fs').readFileSync('plugins/actera/.claude-plugin/plugin.json')).version !==
          process.env.RELEASE_TAG) process.exit(1)"
        timeout-minutes: 5
      - name: Build and verify source archive
        run: |
          git archive --format=zip --prefix=actera-claude-code/ --output="$RUNNER_TEMP/actera-claude-code-$RELEASE_TAG.zip" "$RELEASE_SHA"
          unzip -t "$RUNNER_TEMP/actera-claude-code-$RELEASE_TAG.zip"
          unzip -q "$RUNNER_TEMP/actera-claude-code-$RELEASE_TAG.zip" -d "$RUNNER_TEMP/release-check"
          test -f "$RUNNER_TEMP/release-check/actera-claude-code/.claude-plugin/marketplace.json"
          node scripts/check-plugin.mjs "$RUNNER_TEMP/release-check/actera-claude-code/plugins/actera"
        shell: bash
        timeout-minutes: 5
      - name: Reject a moved or already published release tag
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-plan.mjs --check-tag
        timeout-minutes: 5
      - name: Record release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" "$RUNNER_TEMP/actera-claude-code-$RELEASE_TAG.zip" --verify-tag --generate-notes
        if: ${{ steps.ready.outputs.publish == 'true' }}
        timeout-minutes: 5
    if: ${{ needs.plan.outputs.publish == 'true' }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ matrix.tag }}
      RELEASE_SHA: ${{ matrix.sha }}
concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.event.inputs.tag || github.sha }}
  cancel-in-progress: false
